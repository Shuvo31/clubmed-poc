[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "club-med-mcp-tool"
version = "0.1.0"
description = "Club Med MCP Tool - POC for ChatGPT Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.2",
    "uvicorn>=0.27.0",
]

[project.scripts]
club-med-mcp = "src.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
